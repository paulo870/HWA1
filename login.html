<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poliglota | Secure Access</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo-container">
                <img src="/images/logo.png" alt="Poliglota">
            </div>

            <div class="login-content">

                <h1>Poliglota</h1>

                <p class="subtitle">
                    Interactive Learning Platform
                </p>

                <div class="divider"></div>

                <p class="access-text">
                    This platform is protected.
                    Enter your access password to continue.
                </p>

                <form id="login-form">

                    <div class="input-container">

                        <label for="password">
                            Access Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <button type="submit" id="login-button">
                        <span id="button-text">Access Platform</span>
                        <span id="button-loader" class="loader"></span>
                    </button>

                    <div id="error-message"></div>

                </form>

            </div>

            <div class="login-footer">
                <span>Poliglota Angola</span>
                <span>•</span>
                <span>Secure Access</span>
            </div>

        </div>

    </div>

    <script>

        const form = document.getElementById("login-form");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("login-button");
        const buttonText = document.getElementById("button-text");
        const buttonLoader = document.getElementById("button-loader");
        const errorMessage = document.getElementById("error-message");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const password = passwordInput.value;

            if (!password) {
                return;
            }

            loginButton.disabled = true;
            buttonText.style.display = "none";
            buttonLoader.style.display = "inline-block";
            errorMessage.textContent = "";

            try {

                const response = await fetch("/api/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        password: password
                    })

                });

                const data = await response.json();

                if (response.ok && data.success) {

                    window.location.href = "/";

                } else {

                    errorMessage.textContent =
                        data.error || "Incorrect password.";

                    passwordInput.value = "";
                    passwordInput.focus();

                    loginButton.disabled = false;
                    buttonText.style.display = "inline";
                    buttonLoader.style.display = "none";
                }

            } catch (error) {

                errorMessage.textContent =
                    "Unable to connect. Please try again.";

                loginButton.disabled = false;
                buttonText.style.display = "inline";
                buttonLoader.style.display = "none";
            }

        });

    </script>

</body>
</html>
